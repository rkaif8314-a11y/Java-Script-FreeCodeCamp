<!doctype html>
<html lang="en">
  <head>
    <!-- Define the character encoding and responsive viewport. -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drum Machine</title>

    <!-- Load the styles used for the page and drum-pad layout. -->
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>

    <!-- Main wrapper for the drum pads and sound-name display. -->
    <div id="drum-machine">

      <!-- Grid container that holds all nine playable drum pads. -->
      <div id="pad-bank">

        <!-- Each button contains a keyboard letter and its matching audio clip. -->
        <button class="drum-pad" id="Heater-1" data-key="Q">
          Q
          <audio class="clip" id="Q" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-1.mp3"></audio>
        </button>

        <button class="drum-pad" id="Heater-2" data-key="W">
          W
          <audio class="clip" id="W" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-2.mp3"></audio>
        </button>

        <button class="drum-pad" id="Heater-3" data-key="E">
          E
          <audio class="clip" id="E" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-3.mp3"></audio>
        </button>

        <button class="drum-pad" id="Heater-4" data-key="A">
          A
          <audio class="clip" id="A" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-4_1.mp3"></audio>
        </button>

        <button class="drum-pad" id="Clap" data-key="S">
          S
          <audio class="clip" id="S" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-6.mp3"></audio>
        </button>

        <button class="drum-pad" id="Open-HH" data-key="D">
          D
          <audio class="clip" id="D" src="https://cdn.freecodecamp.org/curriculum/drum/Dsc_Oh.mp3"></audio>
        </button>

        <button class="drum-pad" id="Kick-n-Hat" data-key="Z">
          Z
          <audio class="clip" id="Z" src="https://cdn.freecodecamp.org/curriculum/drum/Kick_n_Hat.mp3"></audio>
        </button>

        <button class="drum-pad" id="Kick" data-key="X">
          X
          <audio class="clip" id="X" src="https://cdn.freecodecamp.org/curriculum/drum/RP4_KICK_1.mp3"></audio>
        </button>

        <button class="drum-pad" id="Closed-HH" data-key="C">
          C
          <audio class="clip" id="C" src="https://cdn.freecodecamp.org/curriculum/drum/Cev_H2.mp3"></audio>
        </button>

      </div>

      <!-- JavaScript updates this paragraph with the triggered pad's ID. -->
      <p id="display">Ready to play!</p>

    </div>

    <!-- Load JavaScript after the HTML elements so they can be selected. -->
    <script src="script.js"></script>
  </body>
</html>
